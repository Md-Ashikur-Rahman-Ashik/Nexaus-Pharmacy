# Restrict the main Gradle process memory
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

# Stop Gradle from spawning separate heavy background daemons
org.gradle.daemon=true

# Force the Kotlin & Java compilers to share the main process memory instead of spawning new forks
kotlin.compiler.execution.strategy=in-process

# Enable AndroidX for proper Jetpack dependency resolution
android.useAndroidX=true

# Keep built-in Kotlin disabled for now; plugins (share_plus, file_picker) still explicitly apply KGP
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
